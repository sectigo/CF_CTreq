name: Scorecard supply-chain security

# Runs the OpenSSF Scorecard checks and publishes the results, which the README's badge
# shows. See https://github.com/ossf/scorecard-action.
on:
  # For the Branch-Protection check, which only checks the default branch.
  branch_protection_rule:
  # So that the Maintained check is updated even when nothing is pushed.
  schedule:
    - cron: "29 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Results can only be published from the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # Uploads the results to the code-scanning dashboard.
      security-events: write
      # Publishes the results, for the badge.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
