name: Differential tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    name: Snippet vs origin parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/differential/origins/go.mod
          cache-dependency-path: test/differential/origins/go.sum
      - run: npm ci
      - run: npm run build
      - run: npm run test:differential
      - run: npm run test:differential
        env:
          CTREQ_DIFF_SNIPPET: dist/cf_ctreq.min.js
