name: Differential tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    name: Snippet vs origin parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/setup-go@v7
        with:
          go-version-file: test/differential/origins/go.mod
          cache-dependency-path: test/differential/origins/go.sum
      - run: npm run test:differential
