name: Minify snippet

on:
  push:
    branches: ["**"]
    paths:
      - cf_ctreq.js
      - package.json
      - package-lock.json
      - terser.config.json
      - .github/workflows/minify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the regenerated snippet.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:minified
      - name: Commit regenerated snippet
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add cf_ctreq.min.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate minified snippet" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:$BRANCH"
